<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthLens - Misinformation Triage Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="mb-8 border-b pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-blue-600">TruthLens</h1>
                <p class="text-sm text-gray-500">Civic Tech: Misinformation Triage Platform</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Feature 1 & 2: Submit Form + Risk Flags -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">Submit a Claim</h2>
                <form id="claimForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Claim Text / Content</label>
                        <textarea id="claimText" rows="3" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Paste viral claim here..." required></textarea>
                        <div id="riskFlagsPreview" class="mt-2 flex flex-wrap gap-1"></div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Source Platform</label>
                        <select id="claimPlatform" class="w-full border rounded-lg p-2 text-sm bg-white">
                            <option value="WhatsApp">WhatsApp</option>
                            <option value="X">X (Twitter)</option>
                            <option value="Instagram">Instagram</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                        <select id="claimCategory" class="w-full border rounded-lg p-2 text-sm bg-white">
                            <option value="Politics">Politics</option>
                            <option value="Health">Health</option>
                            <option value="Finance">Finance</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">
                        Submit Claim
                    </button>
                </form>
            </div>

            <!-- Feature 4: Public Feed & Filters -->
            <div class="md:col-span-2 space-y-4">
                <div class="bg-white p-4 rounded-xl shadow-md border border-gray-100 flex flex-wrap gap-4 justify-between items-center">
                    <h2 class="text-xl font-semibold text-gray-800">Public Feed</h2>
                    <div class="flex gap-2">
                        <select id="filterCategory" class="border rounded-lg p-1.5 text-xs bg-white">
                            <option value="All">All Categories</option>
                            <option value="Politics">Politics</option>
                            <option value="Health">Health</option>
                            <option value="Finance">Finance</option>
                            <option value="Other">Other</option>
                        </select>
                        <select id="filterStatus" class="border rounded-lg p-1.5 text-xs bg-white">
                            <option value="All">All Statuses</option>
                            <option value="Unverified">Unverified</option>
                            <option value="Verified True">Verified True</option>
                            <option value="False">False</option>
                            <option value="Misleading">Misleading</option>
                        </select>
                    </div>
                </div>

                <div id="feedContainer" class="space-y-3"></div>
            </div>
        </div>

        <!-- Feature 5 & 3: Detail View & Review Modal -->
        <div id="detailModal" class="hidden fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
            <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 class="text-lg font-bold text-gray-800">Claim Detail & Review</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
                </div>
                <div>
                    <span class="text-xs text-gray-500">Full Text:</span>
                    <p id="modalText" class="text-gray-800 font-medium mt-1 bg-gray-50 p-3 rounded-lg border"></p>
                </div>
                <div class="grid grid-cols-2 gap-4 text-xs">
                    <div><span class="text-gray-500">Platform:</span> <b id="modalPlatform" class="text-gray-800"></b></div>
                    <div><span class="text-gray-500">Category:</span> <b id="modalCategory" class="text-gray-800"></b></div>
                    <div><span class="text-gray-500">Submitted At:</span> <b id="modalTime" class="text-gray-800"></b></div>
                    <div><span class="text-gray-500">Current Status:</span> <b id="modalStatusDisplay" class="text-blue-600"></b></div>
                </div>
                <div id="modalFlagsContainer"></div>

                <!-- Feature 3: Review Workflow Form -->
                <div class="border-t pt-4 space-y-3">
                    <h4 class="text-sm font-semibold text-gray-700">Review Workflow Action</h4>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Update Status</label>
                        <select id="modalStatusSelect" class="w-full border rounded-lg p-2 text-xs bg-white">
                            <option value="Unverified">Unverified</option>
                            <option value="Verified True">Verified True</option>
                            <option value="False">False</option>
                            <option value="Misleading">Misleading</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Reviewer Note</label>
                        <input type="text" id="modalReviewerNote" class="w-full border rounded-lg p-2 text-xs border-gray-300" placeholder="Add short note explaining verification...">
                    </div>
                </div>
                <div class="flex justify-end pt-2 gap-2">
                    <button onclick="saveReview()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-medium hover:bg-blue-700">Save Review</button>
                    <button onclick="closeModal()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-xs font-medium hover:bg-black">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let claims = [
            {
                id: 1,
                text: "BREAKING: Drink this secret potion of lemon and salt to cure all diseases instantly!!",
                platform: "WhatsApp",
                category: "Health",
                flags: ["Sensational", "ALL CAPS"],
                status: "Unverified",
                reviewerNote: "",
                timestamp: "2026-06-09 10:30"
            },
            {
                id: 2,
                text: "Government announces new subsidy scheme for small business owners starting next month.",
                platform: "X",
                category: "Finance",
                flags: [],
                status: "Verified True",
                reviewerNote: "Confirmed via official notification.",
                timestamp: "2026-06-08 14:15"
            }
        ];

        let activeClaimId = null;

        function detectFlags(content) {
            let flags = [];
            if (content === content.toUpperCase() && content.length > 5) flags.push("ALL CAPS");
            if (content.includes("!") || content.toLowerCase().includes("breaking") || content.toLowerCase().includes("instantly")) flags.push("Sensational");
            if (!content.includes("http") && content.length < 20) flags.push("Un-sourced link/Short text");
            return flags;
        }

        document.getElementById('claimText').addEventListener('input', (e) => {
            const val = e.target.value;
            const preview = document.getElementById('riskFlagsPreview');
            if(!val) { preview.innerHTML = ''; return; }
            const flags = detectFlags(val);
            if(flags.length === 0) {
                preview.innerHTML = `<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">Low Risk</span>`;
            } else {
                preview.innerHTML = `<span class="text-xs text-gray-500 mr-1">Flags:</span>` + flags.map(f => `<span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded font-medium">⚠️ ${f}</span>`).join('');
            }
        });

        document.getElementById('claimForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const text = document.getElementById('claimText').value;
            const platform = document.getElementById('claimPlatform').value;
            const category = document.getElementById('claimCategory').value;

            const newClaim = {
                id: Date.now(),
                text,
                platform,
                category,
                flags: detectFlags(text),
                status: "Unverified",
                reviewerNote: "",
                timestamp: new Date().toISOString().slice(0, 16).replace('T', ' ')
            };

            claims.unshift(newClaim);
            document.getElementById('claimForm').reset();
            document.getElementById('riskFlagsPreview').innerHTML = '';
            renderFeed();
        });

        function renderFeed() {
            const catFilter = document.getElementById('filterCategory').value;
            const statFilter = document.getElementById('filterStatus').value;
            const container = document.getElementById('feedContainer');

            const filtered = claims.filter(c => {
                if(catFilter !== 'All' && c.category !== catFilter) return false;
                if(statFilter !== 'All' && c.status !== statFilter) return false;
                return true;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-8 bg-white rounded-xl shadow-sm">No claims found.</p>`;
                return;
            }

            container.innerHTML = filtered.map(c => `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-3">
                    <div class="flex justify-between items-start">
                        <div class="flex gap-2 items-center">
                            <span class="text-xs bg-gray-100 text-gray-700 px-2.5 py-1 rounded-full font-medium">${c.platform}</span>
                            <span class="text-xs bg-blue-50 text-blue-700 px-2.5 py-1 rounded-full font-medium">${c.category}</span>
                        </div>
                        <span class="text-xs px-2.5 py-1 rounded-full font-bold ${
                            c.status === 'Verified True' ? 'bg-green-100 text-green-700' :
                            c.status === 'False' ? 'bg-red-100 text-red-700' :
                            c.status === 'Misleading' ? 'bg-orange-100 text-orange-700' :
                            'bg-yellow-100 text-yellow-700'
                        }">${c.status}</span>
                    </div>
                    <p class="text-gray-800 text-sm font-medium">${c.text}</p>
                    ${c.flags.length > 0 ? `<div class="flex flex-wrap gap-1">${c.flags.map(f => `<span class="text-[10px] bg-red-50 text-red-600 border border-red-200 px-2 py-0.5 rounded">⚠️ ${f}</span>`).join('')}</div>` : ''}
                    <div class="flex justify-between items-center pt-2 border-t text-xs text-gray-500">
                        <span>Submitted: ${c.timestamp}</span>
                        <button onclick="openModal(${c.id})" class="text-blue-600 font-medium hover:underline">Review / Details &rarr;</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('filterCategory').addEventListener('change', renderFeed);
        document.getElementById('filterStatus').addEventListener('change', renderFeed);

        function openModal(id) {
            activeClaimId = id;
            const c = claims.find(item => item.id === id);
            if(!c) return;

            document.getElementById('modalText').innerText = c.text;
            document.getElementById('modalPlatform').innerText = c.platform;
            document.getElementById('modalCategory').innerText = c.category;
            document.getElementById('modalTime').innerText = c.timestamp;
            document.getElementById('modalStatusDisplay').innerText = c.status;
            document.getElementById('modalStatusSelect').value = c.status;
            document.getElementById('modalReviewerNote').value = c.reviewerNote || '';

            const flagDiv = document.getElementById('modalFlagsContainer');
            if(c.flags.length > 0) {
                flagDiv.innerHTML = `<span class="text-xs text-gray-500">Risk Flags:</span><div class="flex gap-1 mt-1">${c.flags.map(f => `<span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded">⚠️ ${f}</span>`).join('')}</div>`;
            } else {
                flagDiv.innerHTML = '';
            }

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            activeClaimId = null;
        }

        function saveReview() {
            if(!activeClaimId) return;
            const newStatus = document.getElementById('modalStatusSelect').value;
            const note = document.getElementById('modalReviewerNote').value;

            claims = claims.map(c => c.id === activeClaimId ? { ...c, status: newStatus, reviewerNote: note } : c);
            closeModal();
            renderFeed();
        }

        renderFeed();
    </script>
</body>
</html>
